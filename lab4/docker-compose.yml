services:
  db:
    image: postgres:16-alpine
    container_name: booking-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_database.sql:/docker-entrypoint-initdb.d/init_database.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: booking-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  activemq:
    image: apache/activemq-artemis:latest-alpine
    container_name: booking-activemq
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "true"
    ports:
      - "8161:8161"
      - "61616:61616"
    healthcheck:
      test: ["CMD-SHELL", "timeout 10 bash -c 'cat < /dev/null > /dev/tcp/localhost/61616'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s

  app:
    build: .
    container_name: booking-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      activemq:
        condition: service_healthy
      mailhog:
        condition: service_started
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookingdb}
      POSTGRES_USER: ${POSTGRES_USER:-bookinguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookingpass}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/$${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: $${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: $${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_ARTEMIS_USER: artemis
      SPRING_ARTEMIS_PASSWORD: artemis
      SPRING_ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      SPRING_ARTEMIS_CLIENT_ID: booking-app

      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: false
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: false

volumes:
  postgres_data:
